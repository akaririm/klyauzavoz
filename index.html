    <button class="scene-object" id="alframe-item" onclick="playSound('alSong')"><img class="scene-img" src="images/alframe.svg" alt="рамка ал" /></button>
    <div class="scene-deco" id="message-item"><img src="images/message.svg" alt="сообщение" /></div>
    <button class="scene-object" id="kicharb-item" onclick="playSound('robloxYayAudio')"><img class="scene-img" src="images/kicharb.svg" alt="кича рб" /></button>
      <button class="scene-object" id="cyn-item" onclick="playSound('cynSound')"><img class="scene-img" src="images/cyn.svg" alt="цин" /></button>
      <button class="scene-object" id="alek-item" onclick="playSound('alekSound')"><img class="scene-img" src="images/alek.svg" alt="алек" /></button>
      <button class="scene-object" id="bloxy-item" onclick="playSound('drink')"><img class="scene-img" src="images/bloxy.svg" alt="блокси кола" /></button>
      <button class="scene-object" id="note-icon-item" onclick="openNote2()"><img class="scene-img" src="images/note-icon.svg" alt="иконка записки" /></button>
      <div class="gubby-wrapper">
         <img id="gubby1-img" src="images/gubby1.svg" alt="габби 1" />
         <img id="gubby2-img" src="images/gubby2.svg" alt="габби 2" />
      </div>
    </div>
  </section>

    <!-- ПЯТЫЙ ЭКРАН -->
  <section class="screen-5-section" id="fifth-screen">
    <div class="scale-wrapper-s5" id="scaler5">
      <div class="scene-deco" id="deltarune-item"><img src="images/deltarune.svg" alt="дельтарун" /></div>
      <button class="scene-object" id="envelop-item" onclick="openEnvelop()"><img class="scene-img" src="images/envelop-icon.svg" alt="конверт" /></button>
      <div class="scene-deco" id="chainsawman-item"><img src="images/chainsawman.svg" alt="человек бензопила" /></div>
      <div class="scene-deco" id="phone-item"><img src="images/phone.svg" alt="телефон" /></div>
      <div class="scene-deco" id="note-item"><img src="images/note.svg" alt="записка" /></div>
      <div class="scene-deco" id="side-item"><img src="images/side.svg" alt="сайд" /></div>

      <button class="vid-btn" id="al-box" onclick="playSound('all1')">
        <video id="al-video-item" src="images/al.mp4" muted loop playsinline disablePictureInPicture oncontextmenu="return false;"></video>
      </button>

      <button class="vid-btn" id="dox-box" onclick="playSound('all2')">
        <video id="dox-video-item" src="images/dox.mp4" muted loop playsinline disablePictureInPicture oncontextmenu="return false;"></video>
      </button>

      <button class="vid-btn" id="ched-box" onclick="playSound('all3')">
        <video id="ched-video-item" src="images/ched.mp4" muted loop playsinline disablePictureInPicture oncontextmenu="return false;"></video>
      </button>

      <div class="scene-deco" id="frameblu-item"><img src="images/frameblu.svg" alt="синяя рамка" /></div>
      <div class="scene-deco" id="framered-item"><img src="images/framered.svg" alt="красная рамка" /></div>
      <div class="scene-deco" id="framepink-item"><img src="images/framepink.svg" alt="розовая рамка" /></div>
      <div class="scene-deco" id="july-item"><img src="images/july.svg" alt="июль" /></div>
    </div>
  </section>

    <!-- ШЕСТОЙ ЭКРАН -->
  <section class="screen-6-section" id="sixth-screen">
    <div class="scale-wrapper-s6" id="scaler6">
      <video id="angel-video-item" src="images/angel.mp4" autoplay muted loop playsinline disablePictureInPicture oncontextmenu="return false;"></video>
      <div class="scene-deco" id="frame3-item"><img src="images/frame3.svg" alt="рамка для видео 6 слайда" /></div>
      <div class="scene-deco" id="finaltext1-item"><img src="images/finaltext1.svg" alt="финальный текст 1" /></div>
      <div class="scene-deco" id="finaltext2-item"><img src="images/finaltext2.svg" alt="финальный текст 2" /></div>
      <div class="tupami-wrapper">
         <img id="tupami-img" src="images/tupami.svg" alt="тупами" />
         <img id="mimem-img" src="images/mimem.svg" alt="мимем" />
      </div>
      <button class="scene-object" id="flower1-item" onclick="playSound('flower1')"><img class="scene-img" src="images/flower1.svg" alt="цветок 1" /></button>
      <button class="scene-object" id="flower2-item" onclick="playSound('flower2')"><img class="scene-img" src="images/flower2.svg" alt="цветок 2" /></button>
    </div>
  </section>

  <div class="dark-overlay" id="blur-overlay" onclick="closeBook()"></div>
  <div class="book-overlay-panel" id="big-book">
    <img class="big-book-img" src="images/book-overlay.svg" alt="открытая книга" />
    <img class="close-btn-cross" src="images/close-cross.svg" alt="закрыть" onclick="closeBook(); event.stopPropagation();" />
  </div>
  <img class="custom-achievement" id="achievement" src="images/adv.svg" alt="достижение" />
    <!-- ОВЕРЛЕЙ БОЛЬШОГО КОНВЕРТА -->
  <div class="envelop-overlay-panel" id="big-envelop">
    <img class="big-envelop-img" src="images/envelop-overlay.svg" alt="открытый конверт" />
  </div>
    <!-- ОВЕРЛЕЙ БОЛЬШОЙ ЗАПИСКИ С 4 СЛАЙДА -->
  <div class="note2-overlay-panel" id="big-note2">
    <img class="big-note2-img" src="images/note2.svg" alt="открытая записка 2" />
  </div>
  <!-- ЭКРАН СМЕРТИ YOU DIED С ТВОИМИ КНОПКАМИ И ФУНКЦИЯМИ -->
  <div class="death-screen-overlay" id="death-screen">
    <div class="death-scale-wrapper" id="death-scaler">
      <div id="youdied-img-item"><img src="images/youdied.svg" alt="You Died" /></div>
      <button id="respawn-btn-item" onclick="respawnPlayer()"><img src="images/respawn-btn.svg" alt="Возрождение" /></button>
      <button id="title-btn-item" onclick="goToMainMenu()"><img src="images/title-btn.svg" alt="В главное меню" /></button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
